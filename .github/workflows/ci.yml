name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Hard cap: the full suite runs locally before a push, so a slow CI run is a stall, not work. Fail fast.
    # A healthy run takes about 4.5 minutes since the scanner e2e (phase 2b); 8 leaves room for runner variance.
    timeout-minutes: 8
    # Browsers and their system packages come preinstalled: `playwright install --with-deps` spent 18 minutes in
    # apt once. The tag must match the Playwright version in pnpm-lock.yaml; bump both together, digest included.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    env:
      # `vite build` validates the variables declared in src/env.ts but does not bundle their values: the
      # Worker reads the real ones at runtime. e2e overrides ORIGIN with --var and takes its secret from .dev.vars.
      ORIGIN: http://localhost:4173
      BETTER_AUTH_SECRET: build-validation-only
      OFF_CONTACT_EMAIL: build-validation-only@example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright matches the container image
        run: |
          pnpm exec playwright --version | grep -qx 'Version 1.64.1' || {
            echo "::error::Playwright in pnpm-lock.yaml is not 1.64.1: bump the verify container image (tag and digest) and this check together."
            exit 1
          }
      # scripts/e2e-db-reset.sh writes a random BETTER_AUTH_SECRET to .dev.vars when CI is set.
      - run: pnpm verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Longer than verify: a timeout between `db:migrate:remote` and `wrangler deploy` would leave production on
    # the new schema with the old Worker.
    timeout-minutes: 10
    concurrency: deploy
    env:
      # Build time validation only, see the verify job. Production uses vars.ORIGIN and the Worker secret.
      ORIGIN: https://kcal.avp.software
      BETTER_AUTH_SECRET: build-validation-only
      OFF_CONTACT_EMAIL: build-validation-only@example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The Cloudflare credentials reach only the two steps that need them, not the third party actions above.
      - run: pnpm db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
