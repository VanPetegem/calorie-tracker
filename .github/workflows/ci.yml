name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `vite build` validates the variables declared in src/env.ts but does not bundle their values: the
      # Worker reads the real ones at runtime. e2e overrides ORIGIN with --var and takes its secret from .dev.vars.
      ORIGIN: http://localhost:4173
      BETTER_AUTH_SECRET: build-validation-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      # scripts/e2e-db-reset.sh writes a random BETTER_AUTH_SECRET to .dev.vars when CI is set.
      - run: pnpm verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: deploy
    env:
      # Build time validation only, see the verify job. Production uses vars.ORIGIN and the Worker secret.
      ORIGIN: https://kcal.avp.software
      BETTER_AUTH_SECRET: build-validation-only
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:remote
      - run: pnpm build && pnpm wrangler deploy
